<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мини-трекер задач</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Мини-трекер задач на неделю</h1>

    <p id="storage-status" class="notice" role="status" hidden></p>

    <section class="summary" aria-labelledby="summary-title">
      <h2 id="summary-title">Итоги</h2>
      <p id="summary-text" class="summary-text">Выполнено 0 из 0 ч</p>
      <div class="progress-row">
        <div class="progress" role="progressbar" aria-labelledby="summary-title"
             aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <strong id="progress-value" class="progress-value">0%</strong>
      </div>
    </section>

    <section aria-labelledby="form-title">
      <h2 id="form-title">Новая задача</h2>
      <form id="task-form" novalidate>
        <div class="field">
          <label for="title-input">Название</label>
          <input id="title-input" name="title" type="text" autocomplete="off"
                 aria-describedby="title-error">
          <p id="title-error" class="error" hidden></p>
        </div>
        <div class="field">
          <label for="hours-input">Часы (0,5–24, шаг 0,5)</label>
          <input id="hours-input" name="hours" type="text" inputmode="decimal" autocomplete="off"
                 aria-describedby="hours-error">
          <p id="hours-error" class="error" hidden></p>
        </div>
        <button type="submit" class="primary">Добавить задачу</button>
      </form>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title">Задачи</h2>
      <div class="filters" role="group" aria-label="Фильтр списка">
        <button type="button" data-filter="all" aria-pressed="true">Все</button>
        <button type="button" data-filter="active" aria-pressed="false">Активные</button>
        <button type="button" data-filter="done" aria-pressed="false">Выполненные</button>
      </div>
      <p id="empty-message" class="empty" hidden></p>
      <ul id="task-list" class="task-list"></ul>
    </section>
  </main>

  <script type="module" src="app.mjs"></script>
</body>
</html>
