<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мини-трекер задач</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Задачи на неделю</h1>

    <section aria-label="Итоги" class="summary">
      <p>Задач: <strong id="count">0</strong></p>
      <p>Всего часов: <strong id="total">0</strong></p>
      <p>Выполнено часов: <strong id="done-hours">0</strong></p>
      <p>Прогресс: <strong id="progress">0%</strong></p>
      <progress id="bar" max="100" value="0" aria-label="Прогресс по часам"></progress>
    </section>

    <form id="add-form" novalidate>
      <div class="field">
        <label for="title">Название</label>
        <input id="title" name="title" type="text" autocomplete="off" aria-describedby="title-error">
        <p class="error" id="title-error" role="alert"></p>
      </div>
      <div class="field">
        <label for="hours">Часы (0,5–24, шаг 0,5)</label>
        <input id="hours" name="hours" type="text" inputmode="decimal" autocomplete="off" aria-describedby="hours-error">
        <p class="error" id="hours-error" role="alert"></p>
      </div>
      <button type="submit">Добавить задачу</button>
    </form>

    <div class="filters" role="group" aria-label="Фильтр задач">
      <button type="button" data-filter="all" aria-pressed="true">Все</button>
      <button type="button" data-filter="active" aria-pressed="false">Активные</button>
      <button type="button" data-filter="done" aria-pressed="false">Готовые</button>
    </div>

    <ul id="list" aria-label="Список задач"></ul>
    <p id="empty" hidden>Нет задач для показа.</p>
    <p id="storage-note" class="note" hidden></p>
  </main>
  <script type="module" src="app.mjs"></script>
</body>
</html>
